<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Hospital Mágico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="fondo-animado"></div>

    <div class="auth-page">
        <div class="auth-bento glass-panel">
            
            <div class="auth-visual">
                <div class="overlay-visual"></div>
                <div class="visual-content">
                    <div class="logo-auth"><i class="fa-solid fa-hospital-user"></i> Hospital Mágico</div>
                    <h2>Tu salud en tus manos</h2>
                    <p>Accede a tu historial clínico, agenda horas médicas y revisa tus exámenes desde un solo lugar seguro y privado.</p>
                </div>
            </div>

            <div class="auth-formulario">
                <a href="index.html" class="btn-volver-bento"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
                
                <div class="header-form">
                    <h3>Iniciar Sesión</h3>
                    <p>Ingresa a tu portal de paciente</p>
                </div>
                
                <form action="#">
                    <div class="input-group">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" placeholder="RUT (Ej: 12345678-9)" required>
                    </div>
                    
                    <div class="input-group password-group">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="pwdLogin" placeholder="Contraseña" required>
                        <button type="button" class="btn-ojo" onclick="togglePassword('pwdLogin')"><i class="fa-solid fa-eye"></i></button>
                    </div>

                    <div class="opciones-extra">
                        <label class="checkbox-container">
                            <input type="checkbox"> Recordarme
                        </label>
                        <a href="#" class="olvido-pass">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn-primario btn-full">Entrar <i class="fa-solid fa-right-to-bracket"></i></button>
                </form>
                
                <p class="auth-link">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>

        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
